<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AI Аватар — Groq</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #f0f4ff;
      --card: #ffffff;
      --ink: #151515;
      --ink2: #555;
      --ink3: #9a9aa0;
      --border: #dde3f0;
      --accent: #3b5bff;
      --accent-soft: #e4eaff;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .shell {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(30,40,100,0.10);
      width: 100%;
      max-width: 860px;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      overflow: hidden;
    }
    @media(max-width:700px){
      .shell { grid-template-columns: 1fr; }
      .avatar-side { border-right: none; border-bottom: 1px solid var(--border); }
    }

    /* ---- АВАТАР ---- */
    .avatar-side {
      padding: 28px 20px 24px;
      border-right: 1px solid var(--border);
      background: radial-gradient(circle at 30% 0%, #d9e3ff 0%, #f0f4ff 60%, #fff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .scene {
      width: 220px;
      height: 260px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .body-wrap {
      position: relative;
      width: 160px;
      height: 240px;
      transform-origin: center bottom;
      transition: transform 0.4s ease;
    }
    /* голова */
    .head {
      width: 110px;
      height: 130px;
      border-radius: 50% 50% 46% 46%;
      background: #f5d0a9;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 6px 20px rgba(0,0,0,0.09);
      overflow: hidden;
    }
    .hair {
      position: absolute;
      top: -10px; left: -8px;
      width: 125px; height: 68px;
      background: #1a1f2e;
      border-radius: 60% 60% 40% 40%;
    }
    .face {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    /* брови */
    .brow {
      position: absolute;
      top: 40%;
      width: 20px; height: 3px;
      border-radius: 99px;
      background: #1a1f2e;
      transition: transform 0.3s;
    }
    .brow-l { left: 22%; }
    .brow-r { right: 22%; }
    /* глаза */
    .eye {
      position: absolute;
      top: 46%;
      width: 18px; height: 12px;
      background: #fff;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    }
    .eye::after {
      content:"";
      position: absolute;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #1a1f2e;
      top: 1px; left: 5px;
      transition: transform 0.15s;
    }
    .eye-l { left: 22%; }
    .eye-r { right: 22%; }
    /* нос */
    .nose {
      position: absolute;
      bottom: 34%;
      left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.07);
    }
    /* рот */
    .mouth {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%) scaleY(1);
      transform-origin: center top;
      width: 44px; height: 20px;
      background: #d9786a;
      border-radius: 0 0 44px 44px;
      overflow: hidden;
      transition: transform 0.1s;
    }
    .mouth-inner {
      position: absolute;
      bottom: -8px; left: 50%;
      transform: translateX(-50%);
      width: 54px; height: 28px;
      border-radius: 50%;
      background: #a02a2a;
    }
    /* teeth */
    .teeth {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 36px; height: 8px;
      background: #fff;
      border-radius: 0 0 4px 4px;
    }
    /* тело */
    .torso {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px; height: 120px;
      background: linear-gradient(160deg, #1e3a6e, #253f80);
      border-radius: 72px 72px 0 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 18px;
    }
    /* воротник/галстук */
    .collar {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #ffffff22;
    }
    /* руки */
    .arm {
      position: absolute;
      bottom: 40px;
      width: 28px; height: 80px;
      background: linear-gradient(160deg, #1e3a6e, #253f80);
      border-radius: 14px;
      transform-origin: top center;
      transition: transform 0.4s ease;
    }
    .arm-l { left: 6px; transform: rotate(-8deg); }
    .arm-r { right: 6px; transform: rotate(8deg); }
    .arm-l.wave { animation: waveL 0.5s ease-in-out 3; }
    .arm-r.wave { animation: waveR 0.5s ease-in-out 3; }
    @keyframes waveL { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(-26deg)} }
    @keyframes waveR { 0%,100%{transform:rotate(8deg)} 50%{transform:rotate(26deg)} }

    .shadow {
      position: absolute;
      bottom: -6px; left: 50%;
      transform: translateX(-50%);
      width: 120px; height: 20px;
      background: radial-gradient(circle, rgba(0,0,0,0.18), transparent 65%);
      filter: blur(10px);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 99px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.25);
    }
    .avatar-name { font-size: 17px; font-weight: 700; }
    .avatar-desc { font-size: 12px; color: var(--ink3); text-align: center; max-width: 200px; }

    /* ---- ЧАТ ---- */
    .chat-side {
      padding: 22px 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-title { font-size: 15px; font-weight: 700; }
    .chat-sub { font-size: 12px; color: var(--ink3); margin-top: 2px; }

    .log {
      flex: 1;
      min-height: 160px;
      max-height: 260px;
      overflow-y: auto;
      background: #f8f9fc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg { display: flex; gap: 6px; }
    .msg.user { justify-content: flex-end; }
    .bubble {
      max-width: 82%;
      padding: 7px 10px;
      border-radius: 10px;
      line-height: 1.45;
    }
    .msg.bot .bubble { background: #fff; border: 1px solid var(--border); }
    .msg.user .bubble { background: var(--accent); color: #fff; }
    .msg-label { font-size: 10px; color: var(--ink3); margin-bottom: 3px; }

    .controls { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 8px; }
    input.ti {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    input.ti:focus { border-color: var(--accent); }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #f0f2f7; color: var(--ink2); border: 1px solid var(--border); }
    .btn-danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .hint { font-size: 11px; color: var(--ink3); }
    .thinking { color: var(--ink3); font-style: italic; font-size: 12px; }
  </style>
</head>
<body>
<div class="shell">

  <!-- АВАТАР -->
  <div class="avatar-side">
    <div class="scene">
      <div class="shadow"></div>
      <div class="body-wrap" id="bodyWrap">
        <div class="arm arm-l" id="armL"></div>
        <div class="arm arm-r" id="armR"></div>
        <div class="head" id="head">
          <div class="hair"></div>
          <div class="face">
            <div class="brow brow-l" id="browL"></div>
            <div class="brow brow-r" id="browR"></div>
            <div class="eye eye-l"></div>
            <div class="eye eye-r"></div>
            <div class="nose"></div>
            <div class="mouth" id="mouth">
              <div class="teeth"></div>
              <div class="mouth-inner"></div>
            </div>
          </div>
        </div>
        <div class="torso">
          <div class="collar"></div>
        </div>
      </div>
    </div>
    <div class="status-badge"><div class="dot"></div> Онлайн</div>
    <div class="avatar-name">AI Ассистент</div>
    <div class="avatar-desc">Задайте любой вопрос — голосом или текстом</div>
  </div>

  <!-- ЧАТ -->
  <div class="chat-side">
    <div>
      <div class="chat-title">Диалог с ИИ</div>
      <div class="chat-sub">Работает на Groq · Llama 3.3 70B · Бесплатно</div>
    </div>

    <div class="log" id="log">
      <div class="msg bot">
        <div class="bubble">
          <div class="msg-label">Ассистент</div>
          <div>Привет! Я ваш AI‑ассистент. Спросите меня о чём угодно — я готов помочь!</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="row">
        <input id="ti" class="ti" placeholder="Напишите вопрос…" />
        <button id="sendBtn" class="btn btn-primary">➤ Отправить</button>
      </div>
      <div class="row">
        <button id="micBtn" class="btn btn-secondary">🎤 Голос</button>
        <button id="stopMicBtn" class="btn btn-danger" disabled>■ Стоп</button>
        <button id="stopSpeakBtn" class="btn btn-secondary" disabled>🔇 Молчать</button>
      </div>
      <div class="hint" id="hint">Chrome / Edge: поддержка голоса и озвучки.</div>
    </div>
  </div>
</div>

<script>
// ======= GROQ API =======
const GROQ_KEY = "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";
const GROQ_MODEL = "llama-3.3-70b-versatile";

async function askGroq(question) {
  const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + GROQ_KEY
    },
    body: JSON.stringify({
      model: GROQ_MODEL,
      messages: [
        { role: "system", content: "Ты дружелюбный умный помощник. Отвечай по‑русски кратко и понятно, 2–4 предложения. Можешь лёгко шутить." },
        { role: "user", content: question }
      ],
      max_tokens: 400
    })
  });
  if (!r.ok) {
    const e = await r.text();
    console.error("Groq error:", e);
    throw new Error("Groq: " + r.status);
  }
  const d = await r.json();
  return d.choices[0].message.content.trim();
}

// ======= АВАТАР =======
const mouth    = document.getElementById("mouth");
const bodyWrap = document.getElementById("bodyWrap");
const armL     = document.getElementById("armL");
const armR     = document.getElementById("armR");
const browL    = document.getElementById("browL");
const browR    = document.getElementById("browR");

let mouthInt = null;
let idleTimer = null;

function startTalking() {
  stopTalking();
  let open = false;
  mouthInt = setInterval(() => {
    open = !open;
    mouth.style.transform = "translateX(-50%) scaleY(" + (open ? 1.7 : 1.0) + ")";
  }, 120);
  bodyWrap.style.transform = "rotate(" + (Math.random()*3-1.5).toFixed(1) + "deg)";
  browL.style.transform = "translateY(-2px)";
  browR.style.transform = "translateY(-2px)";
}

function stopTalking() {
  if (mouthInt) clearInterval(mouthInt);
  mouth.style.transform = "translateX(-50%) scaleY(1)";
  bodyWrap.style.transform = "rotate(0deg)";
  browL.style.transform = "";
  browR.style.transform = "";
}

function wave() {
  armL.classList.remove("wave"); armR.classList.remove("wave");
  void armL.offsetWidth;
  armL.classList.add("wave"); armR.classList.add("wave");
  setTimeout(() => { armL.classList.remove("wave"); armR.classList.remove("wave"); }, 1600);
}

function idleLoop() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    const a = (Math.random()*5-2.5).toFixed(1);
    bodyWrap.style.transform = "rotate(" + a + "deg)";
    setTimeout(() => { bodyWrap.style.transform = "rotate(0deg)"; }, 1000);
    idleLoop();
  }, 4500 + Math.random()*3000);
}
idleLoop();

// ======= ЧАТ =======
const log = document.getElementById("log");

function addMsg(text, from) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + from;
  const bub = document.createElement("div");
  bub.className = "bubble";
  const lbl = document.createElement("div");
  lbl.className = "msg-label";
  lbl.textContent = from === "user" ? "Вы" : "Ассистент";
  const txt = document.createElement("div");
  txt.textContent = text;
  bub.appendChild(lbl);
  bub.appendChild(txt);
  wrap.appendChild(bub);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return txt;
}

function setHint(t) { document.getElementById("hint").textContent = t; }

// ======= РЕЧЬ =======
const stopSpeakBtn = document.getElementById("stopSpeakBtn");

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ru-RU";
  u.rate = 1.0;
  u.pitch = 1.05;
  u.onstart = () => { startTalking(); stopSpeakBtn.disabled = false; wave(); };
  u.onend   = () => { stopTalking(); stopSpeakBtn.disabled = true; };
  u.onerror = () => { stopTalking(); stopSpeakBtn.disabled = true; };
  window.speechSynthesis.speak(u);
}

stopSpeakBtn.addEventListener("click", () => {
  window.speechSynthesis.cancel();
  stopTalking();
  stopSpeakBtn.disabled = true;
});

// ======= ОТПРАВКА =======
const sendBtn = document.getElementById("sendBtn");
const ti      = document.getElementById("ti");

async function sendText(question) {
  if (!question) return;
  addMsg(question, "user");
  sendBtn.disabled = true;
  sendBtn.textContent = "⏳ Думаю…";
  const thinkEl = addMsg("…", "bot");
  thinkEl.parentElement.parentElement.classList.add("thinking");

  try {
    const reply = await askGroq(question);
    thinkEl.textContent = reply;
    thinkEl.parentElement.parentElement.classList.remove("thinking");
    speak(reply);
  } catch(e) {
    const err = "Ошибка подключения. Попробуйте ещё раз.";
    thinkEl.textContent = err;
    thinkEl.parentElement.parentElement.classList.remove("thinking");
    console.error(e);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = "➤ Отправить";
  }
}

sendBtn.addEventListener("click", () => {
  const q = ti.value.trim(); ti.value = "";
  sendText(q);
});
ti.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
});

// ======= ГОЛОС =======
const micBtn     = document.getElementById("micBtn");
const stopMicBtn = document.getElementById("stopMicBtn");
let recog = null;
let isListening = false;

if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recog = new SR();
  recog.lang = "ru-RU";
  recog.interimResults = false;
  recog.maxAlternatives = 1;

  recog.onstart  = () => { isListening = true; micBtn.disabled = true; stopMicBtn.disabled = false; setHint("🔴 Слушаю… говорите!"); };
  recog.onend    = () => { isListening = false; micBtn.disabled = false; stopMicBtn.disabled = true; setHint("Chrome / Edge: поддержка голоса и озвучки."); };
  recog.onerror  = (e) => { console.error(e); setHint("Ошибка распознавания: " + e.error); };

  recog.onresult = async (e) => {
    const q = e.results[0][0].transcript;
    ti.value = "";
    await sendText(q);
  };

  micBtn.addEventListener("click", () => { if (!isListening) recog.start(); });
  stopMicBtn.addEventListener("click", () => { if (isListening) recog.stop(); });
} else {
  micBtn.disabled = true;
  setHint("Голосовой ввод: только Chrome / Edge.");
}
</script>
</body>
</html>
